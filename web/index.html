<!-- Seguridad: Nanuq habla con el Jellyfin que tú elijas (y con SomeDL), por eso connect/img/media admiten cualquier
     servidor. Lo que se bloquea: TODO script que no sea un archivo de la app (nada en línea, ni <script> ni onerror=…
     ni javascript:), eval, hojas de estilo en línea o de otros sitios (salvo Google Fonts), iframes (el puente de
     Android se expone a todos los marcos), plugins, <base> y el envío de formularios a otra página.
     style-src-attr 'unsafe-inline' deja los atributos style="…" (colores y posiciones calculadas): no ejecutan código.
     El 'unsafe-inline' de style-src solo lo usan navegadores viejos sin style-src-elem/-attr. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src * data: blob:; media-src * data: blob:; connect-src * ws: wss: data: blob:; worker-src 'self'; manifest-src 'self'; frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
